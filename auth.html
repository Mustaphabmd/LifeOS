<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Sign in · LifeOS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='18' fill='%23244bc7'/><text x='32' y='44' text-anchor='middle' font-size='38' font-family='Arial' font-weight='700' fill='white'>L</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f2f2f7;color:#181c23;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,390px);padding:28px;border-radius:28px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 60px rgba(25,31,60,.12);backdrop-filter:blur(24px)}.mark{width:52px;height:52px;display:grid;place-items:center;margin-bottom:22px;border-radius:17px;color:#fff;font-size:22px;font-weight:700;background:linear-gradient(145deg,#111b36,#244bc7 52%,#6d59ef);box-shadow:0 12px 28px rgba(35,65,180,.24)}h1{font-size:28px;line-height:34px;margin:0}p{font-size:14px;line-height:21px;color:#626773;margin:8px 0 22px}.field{display:block;margin:12px 0}.field span{display:block;margin:0 0 7px 3px;font-size:12px;font-weight:600;color:#626773}input{width:100%;height:50px;border:1px solid #dfe2ec;border-radius:15px;background:#f7f8fc;padding:0 15px;font:inherit;outline:none}input:focus{border-color:#0058bc;box-shadow:0 0 0 3px rgba(0,88,188,.11)}button{width:100%;height:50px;margin-top:12px;border:0;border-radius:15px;background:#0058bc;color:#fff;font:600 15px Inter;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{display:none;margin:14px 0 0;padding:12px 14px;border-radius:13px;font-size:13px;line-height:19px}.message.show{display:block}.error{background:#fff0ef;color:#9f1712}.setup{background:#eef3ff;color:#234c98}code{font-size:12px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase/config.js"></script>
</head>
<body>
  <main class="card">
    <div class="mark">L</div>
    <h1>Welcome to LifeOS</h1>
    <p>Sign in to securely sync your personal dashboard across devices.</p>
    <form id="loginForm">
      <label class="field"><span>Email</span><input id="email" type="email" autocomplete="username" maxlength="320" required></label>
      <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <button id="submitButton" type="submit">Sign in</button>
    </form>
    <div id="message" class="message error" role="alert"></div>
  </main>
  <script>
    const config=window.LIFEOS_SUPABASE_CONFIG||{};
    const key=String(config.publishableKey||config.anonKey||'');
    const configured=/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(String(config.url||''))&&key.length>20&&!key.includes('YOUR_')&&!key.startsWith('sb_secret_')&&!key.toLowerCase().includes('service_role');
    const message=document.getElementById('message');
    const showMessage=(value,type='error')=>{message.textContent=value;message.className=`message show ${type}`};
    if(!configured){
      document.getElementById('loginForm').hidden=true;
      showMessage('Supabase is not configured yet. Apply the migration, then update supabase/config.js as described in SETUP.md.','setup');
    }else{
      const client=window.supabase.createClient(config.url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      client.auth.getSession().then(({data})=>{if(data.session)location.replace('./LifeOS.html')});
      document.getElementById('loginForm').addEventListener('submit',async event=>{
        event.preventDefault();
        const button=document.getElementById('submitButton');
        if(button.disabled)return;
        button.disabled=true;message.className='message error';
        const email=document.getElementById('email').value.trim();
        const password=document.getElementById('password').value;
        try{
          const {error}=await client.auth.signInWithPassword({email,password});
          if(error)throw error;
          location.replace('./LifeOS.html');
        }catch(error){showMessage(error.message||'Unable to sign in.');button.disabled=false}
      });
    }
  </script>
</body>
</html>
